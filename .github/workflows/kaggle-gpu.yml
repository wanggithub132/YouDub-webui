name: YouDub Kaggle GPU（单条认领）

on:
  # 定时：每天 3 次消化表格任务（北京 10/17/20 点，比 dapang 早 1 小时，避开凌晨）
  schedule:
    - cron: "0 2,9,12 * * *"
  # 手动：留空走表格认领；填单条链接则只处理不投稿（调试用，不动表格）
  workflow_dispatch:
    inputs:
      video_url:
        description: "单条视频链接（留空则从 Google 表格认领一条）"
        required: false
        default: ""

concurrency:
  # 同一时间只允许一个在跑：避免撞 Kaggle GPU 配额，也避免表格重复认领
  group: youdub-kaggle-gpu
  cancel-in-progress: false

env:
  BILI_UP_VER: v0.2.4

jobs:
  kaggle-gpu:
    name: 认领一条 → Kaggle 处理 → 投稿 B站
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OUTPUTS_SLUG: ${{ secrets.KAGGLE_USERNAME }}/youdub-outputs
      GIST_ID: ${{ secrets.GIST_ID }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
      # Google 凭证只走 Secrets，绝不进 Gist（Google 会扫描 Gist 自动撤销私钥）
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      SHEET_ID: ${{ vars.SHEET_ID }}
      # YouDub 专属工作表名（如「拳击零基础」），与 dapang 的「表格1」隔离，避免抢行
      SHEET_TAB: ${{ vars.SHEET_TAB }}
    steps:
      - name: 参数验证（缺必填配置立即失败）
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_COOKIE: ${{ secrets.YOUTUBE_COOKIE }}
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: |
          set -uo pipefail
          MISSING=""
          [ -z "${KAGGLE_USERNAME:-}" ] && MISSING="$MISSING KAGGLE_USERNAME(Secret)"
          [ -z "${KAGGLE_KEY:-}" ] && MISSING="$MISSING KAGGLE_KEY(Secret)"
          [ -z "${OPENAI_API_KEY:-}" ] && MISSING="$MISSING OPENAI_API_KEY(Secret)"
          [ -z "${YOUTUBE_COOKIE:-}" ] && MISSING="$MISSING YOUTUBE_COOKIE(Secret)"
          # 表格认领模式才需要凭证/表格配置（手动单条调试可缺省）
          if [ -z "${INPUT_VIDEO_URL:-}" ]; then
            [ -z "${GOOGLE_CREDENTIALS:-}" ] && MISSING="$MISSING GOOGLE_CREDENTIALS(Secret)"
            [ -z "${GIST_ID:-}" ] && MISSING="$MISSING GIST_ID(Secret)"
            [ -z "${GIT_TOKEN:-}" ] && MISSING="$MISSING GIT_TOKEN(Secret)"
            [ -z "${SHEET_ID:-}" ] && MISSING="$MISSING SHEET_ID(Variable)"
            [ -z "${SHEET_TAB:-}" ] && MISSING="$MISSING SHEET_TAB(Variable)"
          fi
          if [ -n "$MISSING" ]; then
            echo "❌ 缺少必填配置:$MISSING"
            echo "   GOOGLE_CREDENTIALS = 服务账号 JSON 全文；Gist 内只需 cookie.json(YouDub专属B站账号, biliup login 产物)"
            exit 1
          fi
          case "$YOUTUBE_COOKIE" in
            '# Netscape'*|'# HTTP Cookie'*) : ;;
            *) echo "⚠️ YOUTUBE_COOKIE 首行不是 '# Netscape HTTP Cookie File'，可能不是导出的 cookies.txt 全文，请确认" ;;
          esac
          echo "✅ 参数验证通过"

      - name: 检出代码（含 dapang submodule）
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装依赖（kaggle CLI + dapang 表格/Gist/封面能力所需）
        run: pip install -q kaggle gspread oauth2client requests curl_cffi==0.16.0

      - name: 从表格认领一条任务（读取即写「处理中」）
        id: claim
        env:
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: python .github/script/sheet_task.py claim

      - name: 确保产物数据集存在（去重依据 + 产物归档）
        if: steps.claim.outputs.has_video == 'true'
        run: |
          set -uo pipefail
          if kaggle datasets status "$OUTPUTS_SLUG" 2>/dev/null | grep -qi ready; then
            echo "产物数据集已存在"
          else
            echo "首次运行：创建空的产物数据集 $OUTPUTS_SLUG"
            rm -rf outds && mkdir -p outds
            echo "YouDub 产物归档（每个视频一个 {vid}.zip）" > outds/README.txt
            python3 - <<EOF
          import json, os, pathlib
          user = os.environ["KAGGLE_USERNAME"]
          meta = {"title": "youdub-outputs", "id": f"{user}/youdub-outputs",
                  "licenses": [{"name": "CC0-1.0"}]}
          pathlib.Path("outds/dataset-metadata.json").write_text(json.dumps(meta, indent=2))
          EOF
            kaggle datasets create -p outds --dir-mode zip || true
            sleep 15
          fi

      - name: 组装 kernel（注入单条链接/密钥/cookie + 挂载两个数据集）
        if: steps.claim.outputs.has_video == 'true'
        env:
          CLAIMED_VIDEO_URL: ${{ steps.claim.outputs.video_url }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_COOKIE: ${{ secrets.YOUTUBE_COOKIE }}
        run: |
          mkdir -p kernel
          cp .github/script/gpu_runner.py kernel/gpu_runner.py
          python3 - <<'EOF'
          import base64, json, os, pathlib

          p = pathlib.Path("kernel/gpu_runner.py")
          s = p.read_text()
          # 单条认领模式：只注入认领到的链接，表格 CSV 批量入口退役
          s = s.replace("__VIDEO_URL__", os.environ["CLAIMED_VIDEO_URL"].strip())
          s = s.replace("__SHEET_CSV_URL__", "")
          s = s.replace("__BATCH_SIZE__", "1")
          s = s.replace("__OPENAI_API_KEY__", os.environ["OPENAI_API_KEY"].strip())
          cookie = os.environ.get("YOUTUBE_COOKIE", "")
          s = s.replace("__YOUTUBE_COOKIE_B64__",
                        base64.b64encode(cookie.encode()).decode())
          p.write_text(s)

          user = os.environ["KAGGLE_USERNAME"]
          meta = {
              "id": f"{user}/youdub-gpu-run",
              "title": "youdub-gpu-run",
              "code_file": "gpu_runner.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              # 锁定 T4 加速器，避免抽到 P100（抽卡重试仍保留作兜底）
              "machine_shape": "NvidiaTeslaT4",
              "enable_internet": True,
              # 关键：挂载模型缓存 + 产物数据集（产物用于去重）
              "dataset_sources": [f"{user}/youdub-models", f"{user}/youdub-outputs"],
              "competition_sources": [],
              "kernel_sources": [],
          }
          pathlib.Path("kernel/kernel-metadata.json").write_text(json.dumps(meta, indent=2))
          EOF

      - name: 推送并等待（非 T4 自动重推，最多 4 次）
        if: steps.claim.outputs.has_video == 'true'
        run: |
          set -uo pipefail
          SLUG="$KAGGLE_USERNAME/youdub-gpu-run"
          MAX_ATTEMPTS=4

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "===== 第 $attempt/$MAX_ATTEMPTS 次推送 ====="
            # --timeout: kernel 硬超时 5.5h，防止 Actions 走后 kernel 继续空烧 GPU 配额
            kaggle kernels push -p kernel --timeout 19800

            # 轮询直到 complete/error（最长约 5.3 小时，留余量给下载/归档）
            # 状态统一转小写再匹配：新版 CLI 输出格式/大小写不固定（如 KernelWorkerStatus.ERROR）
            for i in $(seq 1 320); do
              sleep 60
              STATUS=$(kaggle kernels status "$SLUG" 2>&1 || true)
              echo "[$i min] $STATUS"
              LOWER=$(printf '%s' "$STATUS" | tr '[:upper:]' '[:lower:]')
              case "$LOWER" in
                *complete*|*error*|*cancel*) break ;;
              esac
            done

            rm -rf out && mkdir -p out
            kaggle kernels output "$SLUG" -p out || true
            RESULT=$(head -1 out/RESULT.txt 2>/dev/null || echo "NO_RESULT")
            echo "本次结果: $RESULT"

            if [ "$RESULT" = "SUCCESS" ]; then
              echo "✅ 成功"; ls -lh out/; exit 0
            elif [ "$RESULT" = "GPU_NOT_T4" ]; then
              echo "🎲 分到非 T4 GPU，重新推送抽卡..."; continue
            else
              echo "❌ 失败: $RESULT"
              echo "--- kernel 日志尾部 ---"
              tail -200 out/*.log 2>/dev/null || true
              exit 1
            fi
          done

          echo "❌ 连续 $MAX_ATTEMPTS 次未抽到 T4，放弃（下次定时会自动重试）"
          exit 1

      - name: 归档产物到数据集（供下次去重 + 长期留存）
        if: success() && steps.claim.outputs.has_video == 'true'
        run: |
          set -uo pipefail
          shopt -s nullglob
          NEW_ZIPS=(out/*.zip)
          if [ ${#NEW_ZIPS[@]} -eq 0 ]; then
            echo "本次无新产物（可能此前已处理过），跳过归档"; exit 0
          fi
          rm -rf outds && mkdir -p outds
          kaggle datasets download "$OUTPUTS_SLUG" -p outds --unzip || true
          rm -f outds/dataset-metadata.json
          cp out/*.zip outds/ || true
          python3 - <<EOF
          import json, os, pathlib
          user = os.environ["KAGGLE_USERNAME"]
          meta = {"title": "youdub-outputs", "id": f"{user}/youdub-outputs",
                  "licenses": [{"name": "CC0-1.0"}]}
          pathlib.Path("outds/dataset-metadata.json").write_text(json.dumps(meta, indent=2))
          EOF
          kaggle datasets version -p outds -m "add $(ls out/*.zip | wc -l) zips" --dir-mode zip --delete-old-versions

      - name: 投稿到 B站（仅表格认领模式）
        if: success() && steps.claim.outputs.claimed == 'true'
        env:
          VID: ${{ steps.claim.outputs.vid }}
          BILI_TID: ${{ vars.BILI_TID }}
          BILI_TAGS: ${{ vars.BILI_TAGS }}
          ZIP_DIR: out
          DOUYIN_ACCOUNT: ${{ secrets.DOUYIN_ACCOUNT }}
          DOUYIN_DIR: .sau
        run: |
          set -uo pipefail
          # 安装 biliup-rs
          wget -q https://github.com/biliup/biliup-rs/releases/download/$BILI_UP_VER/biliupR-$BILI_UP_VER-x86_64-linux.tar.xz
          tar xf biliupR-$BILI_UP_VER-x86_64-linux.tar.xz
          sudo mv biliupR-$BILI_UP_VER-x86_64-linux/biliup /usr/local/bin/
          sudo chmod +x /usr/local/bin/biliup

          # 抖音上传环境（social-auto-upload，可选能力：任一步失败只告警，不阻断 B站投稿）
          if [ -n "$DOUYIN_ACCOUNT" ]; then
            git clone --depth 1 https://github.com/dreammis/social-auto-upload.git .sau \
              || echo "[WARN] SAU clone 失败，跳过抖音推送"
            pip install -e .sau \
              || echo "[WARN] SAU 依赖安装失败，跳过抖音推送"
            cp .sau/conf.example.py .sau/conf.py 2>/dev/null || true
            # opencv-python（sau 依赖）在 Linux 需 libGL.so.1，runner 默认没有，缺了 sau 在 import 阶段秒挂
            sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg >/dev/null 2>&1 \
              || echo "[WARN] libgl1/ffmpeg 安装失败，跳过抖音推送"
            # chromium 必须装当前用户缓存（sudo 会重置 HOME，须显式传回，否则 patchright 找不到 user-site 模块）；系统依赖用 sudo env PATH 装
            sudo env "PATH=$PATH" "HOME=$HOME" patchright install-deps chromium \
              || echo "[WARN] chromium 系统依赖安装失败，跳过抖音推送"
            patchright install chromium \
              || echo "[WARN] chromium 安装失败，跳过抖音推送"
          else
            echo "未配置 DOUYIN_ACCOUNT，跳过抖音环境安装"
          fi

          # 产物兜底：本次 kernel 没有新 zip（此前已处理过）时，从数据集补拉
          if [ ! -f "out/$VID.zip" ]; then
            echo "out/ 缺 $VID.zip，从产物数据集补拉..."
            kaggle datasets download "$OUTPUTS_SLUG" -f "$VID.zip" -p out
            # Kaggle 单文件下载可能再包一层 zip，归一化
            if [ -f "out/$VID.zip.zip" ]; then
              unzip -o -q "out/$VID.zip.zip" -d out && rm "out/$VID.zip.zip"
            fi
          fi

          python .github/script/publish_bilibili.py

      - name: 失败兜底：把已认领行标记「失败」
        if: failure() && steps.claim.outputs.claimed == 'true'
        run: python .github/script/sheet_task.py mark-failed

      - name: 上传日志（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: youdub-debug-log
          path: out/
          retention-days: 7
          if-no-files-found: ignore
