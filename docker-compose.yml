# ---------------------------------------------------------------
# YouDub WebUI - Docker Compose
#
# 有 NVIDIA GPU:  docker compose up --build
# 仅 CPU (极慢):  docker compose -f docker-compose.yml -f docker-compose.cpu.yml up --build
# ---------------------------------------------------------------

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DEVICE: cuda
    volumes:
      - ./data:/app/data
      - ./workfolder:/app/workfolder
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NEXT_SERVER_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
